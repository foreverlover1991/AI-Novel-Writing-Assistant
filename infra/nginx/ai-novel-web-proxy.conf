# Web 前端容器配置：SPA 静态资源 + /api 反向代理到后端容器。
# 服务端全部路由（含漫画等图片资源）都在 /api 前缀下，因此只需代理 /api/。
upstream ai_novel_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全头只作用于静态资源：API 响应由后端自身（helmet）设置，在反代层重复添加会产生同名双头。
    # nginx 的 add_header 不跨层级继承：location 内一旦声明 add_header，server 级的同名声明全部失效，
    # 因此每个带 add_header 的 location 都要把安全头重复写一遍。

    # 正文导入接口服务端放宽到 30mb，这里留出余量。
    client_max_body_size 32m;

    location /assets/ {
        # Vite 产物文件名带内容哈希，1 年 max-age 足够；不另写 Cache-Control，避免与 expires 生成的双头。
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://ai_novel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # LLM 流式输出与 SSE 进度推送：禁止缓冲，避免首字延迟和流被截断。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 自动导演单章生成、拆书等长任务由服务端自行控制超时，代理侧只保证不先断开。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 入口页必须不缓存，否则升级后用户仍加载旧的资源清单；这里用 no-cache 而不是 no-store，浏览器仍可做 304 协商。
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
