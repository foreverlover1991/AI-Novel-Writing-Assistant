name: ai-novel-web

# 前后端分离自托管编排。
# 约定：
#   1. 所有服务都跑在本编排的私有网络里，只有 web 对外暴露一个端口（默认 8080 ）。
#   2. 前端产物由宿主机 pnpm 打包生成 client/dist，再以只读卷挂载进 nginx 容器，不进镜像。
#   3. 数据库、向量库、生成图片与应用日志全部 bind mount 到宿主机 data 目录
#      （默认仓库根 data/，可用 DATA_PATH 覆盖），容器重建不丢数据，便于直接查看与备份。
# 变量放在同目录 .env（模板见 .env.example）。镜像名直接写在各服务的 image 字段，
# 不留变量，统一用内网仓库 10.62.107.200:30085 前缀；其中 qdrant 在内网仓库没有
# 对应 repository，本机用 docker tag 从官方镜像补的内网名，换机器部署需先同样打名。
#
# 兼容提示：宿主 Docker 低于 20.10.10 时，默认 seccomp 配置未放行 clone3，
# PostgreSQL 与 Qdrant 会因 “Operation not permitted” 无法启动子进程/线程。
# 因此这两个服务单独放宽 seccomp；把 Docker 升级到 20.10.10 以上后可以删掉这两行 security_opt。
# nginx 与 musl 版 Node 容器不受影响，保持默认收紧。

services:
  postgres:
    image: 10.62.107.200:30085/agentops/middleware/postgres:16.15-arm64
    container_name: ai-novel-postgres
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_novel}
      POSTGRES_USER: ${POSTGRES_USER:-ai_novel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 infra/.env 中设置 PostgreSQL 密码}
    volumes:
      - ${DATA_PATH:-../data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_novel} -d ${POSTGRES_DB:-ai_novel}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [default]

  qdrant:
    image: 10.62.107.200:30085/agentops/middleware/qdrant:v1.19-arm64
    container_name: ai-novel-qdrant
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${DATA_PATH:-../data}/qdrant:/qdrant/storage
    networks: [default]

  api:
    image: ai-novel-api:latest
    container_name: ai-novel-api
    restart: unless-stopped
    # 数据目录归宿主机账号所有（本机 uid 1001），容器进程用同一 uid 写挂载目录；
    # 换机器部署时按宿主账号 uid 调整，或用 DATA_PATH 指向属主匹配的目录。
    user: "${API_RUN_UID:-1001}:1001"
    extra_hosts:
      token-api.gientech.com: "10.64.84.120"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      NODE_ENV: production
      # 容器之间访问必须监听非回环地址；该端口未被发布到宿主机，外部不可达。
      HOST: 0.0.0.0
      PORT: "3000"
      ALLOW_LAN: "false"
      AI_NOVEL_DATABASE_MODE: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_novel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_novel}
      AI_NOVEL_ACCESS_TOKEN: ${AI_NOVEL_ACCESS_TOKEN:?必须在 infra/.env 中设置访问令牌}
      DIRECTOR_NEXT_ENABLED: ${DIRECTOR_NEXT_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      API_JSON_LIMIT: ${API_JSON_LIMIT:-5mb}
      NOVEL_SNAPSHOT_RETENTION_COUNT: ${NOVEL_SNAPSHOT_RETENTION_COUNT:-10}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-ai_novel_chunks_v1}
      # 把 LLM 会话与修复日志写到 /app/.logs（随卷落在 data/logs），内置 14 天 / 50MB 自动清理。
      LLM_DEBUG_LOG: ${LLM_DEBUG_LOG:-true}
      LLM_DEBUG_FILE_LOG: ${LLM_DEBUG_FILE_LOG:-true}
    volumes:
      # 应用以 node 用户写 /app/server/storage，生成图片目录必须挂在真实写入路径上。
      - ${DATA_PATH:-../data}/generated-images:/app/server/storage/generated-images
      # LLM 会话日志按日期写在 /app/.logs 下的 *.jsonl，挂出来便于直接查看与归档。
      - ${DATA_PATH:-../data}/logs:/app/.logs
    # 模型供应商密钥不进本文件：优先在系统设置里配置（存 PostgreSQL，随卷保留） ，
    # 需要用环境变量注入时创建 api.env 并按下方路径挂载。
    env_file:
      - path: ./api.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks: [default]

  web:
    image: 10.62.107.200:30085/agentops/middleware/nginx:1.30.2-arm64
    container_name: ai-novel-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${CLIENT_DIST_PATH:-../client/dist}:/usr/share/nginx/html:ro
      - ./nginx/ai-novel-web-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_PATH:-../data}/logs/nginx:/var/log/nginx
    ports:
      - "${WEB_BIND_ADDR:-0.0.0.0}:${WEB_PORT:-8080}:80"
    networks: [default]

  # 一次性任务：docker-compose --profile tools run --rm migrate
  # 走官方 PostgreSQL 基线路径，不改写历史迁移 SQL，空库先应用当前 schema 再登记历史目录。
  migrate:
    image: ai-novel-api:latest
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_NOVEL_DATABASE_MODE: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_novel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_novel}
    volumes:
      - ${SCRIPTS_PATH:-../scripts}:/app/scripts:ro
    entrypoint: ["node", "/app/scripts/deploy-prisma-postgres.cjs"]
    networks: [default]

networks:
  default:
    name: ai-novel-web
